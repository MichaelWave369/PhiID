# LOCAL DEV ONLY. Do not expose this service to LAN/WAN or deploy as production.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm", "--hostname=http://127.0.0.1:8080"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Set KC_BOOTSTRAP_ADMIN_USERNAME in private .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set KC_BOOTSTRAP_ADMIN_PASSWORD in private .env}
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./realm:/opt/keycloak/data/import:ro
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
